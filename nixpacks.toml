# Railway build for the standalone Next.js output.
#
# `output: 'standalone'` emits `.next/standalone/server.js` plus only the
# traced node_modules, and leaves out `public/` and `.next/static/` — Next
# assumes a CDN serves those. They are copied in by the `postbuild` script,
# not from here: a build command set in the Railway dashboard replaces this
# phase wholesale, and the copy would silently stop happening.

[phases.setup]
nixPkgs = ['nodejs_22']

[phases.install]
cmds = ['npm ci']

[phases.build]
cmds = ['npm run build']

# HOSTNAME must be forced.
#
# The generated server does `process.env.HOSTNAME || '0.0.0.0'`, and every
# container runtime — Railway included — sets HOSTNAME to the container id.
# Next then binds to that name instead of every interface, and the platform
# health check cannot reach the port: "service unavailable", then "1/1 replicas
# never became healthy". Keep this in step with `railway.json`, whose
# startCommand takes precedence over this one.
[start]
cmd = 'HOSTNAME=0.0.0.0 node .next/standalone/server.js'
